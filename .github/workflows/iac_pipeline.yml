# --- This workflow is triggered on push to the main branch and when changes are made to the 'iac' directory. It sets up AWS credentials, configures SSH keys, initializes Terraform, applies the infrastructure changes, and runs Ansible playbooks for configuration management. ---
# --- Este flujo de trabajo se activa al hacer push a la rama principal y cuando se realizan cambios en el directorio 'iac'. Configura las credenciales de AWS, configura claves SSH, inicializa Terraform, aplica los cambios de infraestructura y ejecuta playbooks de Ansible para la gestión de configuración. ---
name: "Pipeline IaC: Terraform + Ansible"

on:
  push:
    branches:
      - main
    paths:
      - 'iac/**'
  workflow_dispatch:
# --- Jobs for deploying and destroying infrastructure using Terraform and Ansible. ---
# --- Trabajos para desplegar y destruir infraestructura utilizando Terraform y Ansible. ---
jobs:
  deploy_iac:
    name: "Despliegue de Infraestructura y Configuración"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./iac
    # --- Steps for checking out code, configuring AWS credentials, setting up SSH keys, initializing Terraform, applying infrastructure changes, and running Ansible playbooks. ---
    # --- Pasos para hacer checkout del código, configurar credenciales de AWS, configurar claves SSH, inicializar Terraform, aplicar cambios de infraestructura y ejecutar playbooks de Ansible. ---
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configurar clave SSH fija para AWS y Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/aws_ansible_key.pub
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/aws_ansible_key
          chmod 600 ~/.ssh/aws_ansible_key
          chmod 644 ~/.ssh/aws_ansible_key.pub

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Instalar Ansible y dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Crear archivo .vault_password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_password

      - name: Ejecutar Ansible Playbook
        run: ansible-playbook site.yml